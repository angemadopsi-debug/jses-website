<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSES - Jupiter Software & Engineering Solutions | B2B Procurement India</title>
    <meta name="description" content="JSES is an India-focused engineering procurement support company specializing in PLC/automation hardware, industrial valves, and process instrumentation.">
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* --- DESIGN SYSTEM & CSS VARIABLES --- */
        :root {
            --primary: #0F2C59;       /* Deep Industrial Blue */
            --secondary: #FF6B35;     /* Accent Orange */
            --text-dark: #1E293B;     /* Charcoal for readability */
            --text-light: #64748B;    /* Muted Slate */
            --bg-light: #F8F9FA;      /* Section Light Background */
            --white: #FFFFFF;
            --font: 'Inter', sans-serif;
            --transition: all 0.3s ease;
        }

        /* --- GLOBAL STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            color: var(--text-dark);
            line-height: 1.6;
            background-color: var(--white);
        }
        ul { list-style: none; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; height: auto; }

        /* --- HEADER & NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            z-index: 1000;
            transition: var(--transition);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .logo span { color: var(--secondary); }
        
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        .nav-link {
            font-weight: 500;
            color: var(--text-dark);
            transition: var(--transition);
        }
        .nav-link:hover { color: var(--secondary); }
        .coming-soon {
            font-size: 0.75rem;
            background: #E2E8F0;
            color: var(--text-light);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            margin-left: 0.3rem;
        }
        .btn-header {
            background: var(--secondary);
            color: var(--white);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: 600;
            transition: var(--transition);
        }
        .btn-header:hover { background: #e0531f; }
        
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* --- SECTIONS COMMON --- */
        section {
            padding: 5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section-title {
            text-align: center;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 3rem;
            position: relative;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--secondary);
            margin: 0.5rem auto 0 auto;
            border-radius: 2px;
        }

        /* --- HERO SECTION --- */
        #hero {
            max-width: 100%;
            background: linear-gradient(135deg, rgba(15, 44, 89, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%), 
                        url('https://unsplash.com') no-repeat center center/cover;
            color: var(--white);
            padding: 9rem 2rem 6rem 2rem;
            text-align: center;
        }
        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }
        .hero-content h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }
        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }
        .btn-hero {
            background: var(--secondary);
            color: var(--white);
            padding: 0.8rem 2rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-block;
            transition: var(--transition);
        }
        .btn-hero:hover { background: #e0531f; transform: translateY(-2px); }

        /* --- MANUFACTURERS BAR --- */
        .manufacturers {
            background: var(--bg-light);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #E2E8F0;
        }
        .brands-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
            font-weight: 700;
            color: var(--text-light);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* --- ABOUT SECTION --- */
        #about .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }
        .about-text h3 { color: var(--primary); margin-bottom: 1rem; font-size: 1.5rem; }
        .about-text p { color: var(--text-light); margin-bottom: 1.5rem; }

        /* --- PRODUCTS GRID --- */
        #products-section { background-color: var(--bg-light); max-width: 100%; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: var(--white);
            padding: 2.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border-top: 4px solid var(--primary);
            transition: var(--transition);
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .product-card i { font-size: 2.5rem; color: var(--secondary); margin-bottom: 1.5rem; }
        .product-card h3 { font-size: 1.4rem; margin-bottom: 1rem; color: var(--primary); }
        .product-card ul li { position: relative; padding-left: 1.2rem; margin-bottom: 0.5rem; color: var(--text-light); }
        .product-card ul li::before { content: "✓"; position: absolute; left: 0; color: var(--secondary); font-weight: bold; }

        /* --- PROCESS / HOW IT WORKS --- */
        .process-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
        }
        .step-card {
            text-align: center;
            position: relative;
        }
        .step-num {
            width: 50px;
            height: 50px;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin: 0 auto 1rem auto;
            font-size: 1.2rem;
        }
        .step-card h4 { margin-bottom: 0.5rem; color: var(--primary); }
        .step-card p { font-size: 0.9rem; color: var(--text-light); }

        /* --- ENQUIRY FORM & CONTACT --- */
        #contact-section { background-color: var(--white); }
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 4rem;
        }
        .contact-info {
            background: var(--primary);
            color: var(--white);
            padding: 3rem 2rem;
            border-radius: 8px;
        }
        .contact-info h3 { margin-bottom: 1.5rem; font-size: 1.6rem; color: var(--secondary); }
        .info-item { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1.5rem; }
        .info-item i { font-size: 1.2rem; margin-top: 0.3rem; }
        
        .enquiry-form-container {
            background: var(--bg-light);
            padding: 3rem 2.5rem;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .form-group { display: flex; flex-direction: column; margin-bottom: 1.2rem; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--primary); }
        .form-group input, .form-group select, .form-group textarea {
            padding: 0.75rem;
            border: 1px solid #CBD5E1;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
.border-color: var(--primary);box-shadow: 0 0 0 3px rgba(15,44,89,0.1);}.btn-submit {background: var(--secondary);color: var(--white);border: none;padding: 1rem 2rem;font-size: 1.05rem;font-weight: 700;border-radius: 4px;cursor: pointer;transition: var(--transition);width: 100%;}.btn-submit:hover { background: #e0531f; }/* --- FLOATING WHATSAPP --- */.whatsapp-float {position: fixed;bottom: 30px;right: 30px;background-color: #25D366;color: white;border-radius: 50%;width: 60px;height: 60px;display: flex;align-items: center;justify-content: center;font-size: 32px;box-shadow: 0 4px 10px rgba(0,0,0,0.3);z-index: 1000;transition: var(--transition);}.whatsapp-float:hover { transform: scale(1.1); }/* --- FOOTER --- */footer {background: #0B1B32;color: #94A3B8;text-align: center;padding: 2rem;font-size: 0.9rem;border-top: 1px solid #1E293B;}/* --- RESPONSIVE MEDIA QUERIES --- */@media (max-width: 968px) {.nav-menu {position: fixed;top: 70px;left: -100%;width: 100%;height: calc(100vh - 70px);background: var(--white);flex-direction: column;padding: 3rem 2rem;gap: 2rem;transition: var(--transition);box-shadow: 0 10px 15px rgba(0,0,0,0.05);}.nav-menu.active { left: 0; }.menu-toggle { display: block; }#about .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 2.5rem; }.form-grid { grid-template-columns: 1fr; }.form-group.full-width { grid-column: span 1; }.hero-content h1 { font-size: 2.2rem; }}SIEMENSROCKWELLEMERSONABBSCHNEIDER ELECTRICAccepted formats: PDF, Excel, Word (Max 10MB).Your Name & Designation *Company Name *Business Email *Mobile / WhatsApp Number *Company Delivery Location *Submit Technical Enquiry© 2026 Jupiter Software & Engineering Solutions (JSES). All rights reserved.Designed for Corporate Engineering & Technology Compliance.// 1. MOBILE MENU TOGGLEconst mobileMenu = document.getElementById('mobile-menu');const navMenu = document.querySelector('.nav-menu');mobileMenu.addEventListener('click', () => {navMenu.classList.toggle('active');const icon = mobileMenu.querySelector('i');if(navMenu.classList.contains('active')) {icon.className = 'fa-solid fa-xmark';} else {icon.className = 'fa-solid fa-bars';}});// Close menu when clicking a nav linkdocument.querySelectorAll('.nav-link, .btn-header').forEach(link => {link.addEventListener('click', () => {navMenu.classList.remove('active');mobileMenu.querySelector('i').className = 'fa-solid fa-bars';});});// 2. FORM SUBMISSION HANDLING (B2B simulation)document.getElementById('jsesEnquiryForm').addEventListener('submit', function(e) {e.preventDefault();// Collect form dataconst formData = new FormData(this);// Technical Validation Alertalert(Thank you, ${formData.get('clientName')} from ${formData.get('company')}.\n\nYour technical enquiry for [${formData.get('manufacturer')} - ${formData.get('category').toUpperCase()}] has been securely logged.\n\nOur engineering backend will verify the parameters and dispatch a quote directly to ${formData.get('email')} and WhatsApp shortly.);this.reset();});
